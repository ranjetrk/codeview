<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeView</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.cdnfonts.com/css/google-sans" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://unpkg.com/mammoth@1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
  :root{
    --bg:#0f1012; --fg:#e8e9ec; --muted:#9aa1ab; --faint:#6b7177;
    --border:#26282d; --sidebar:#161719; --accent:#1e2024; --sel:#24262b; --ring:#3a3f47;
    --primary:#e8e9ec; --card:#161719; --blue:#60a5fa; --hi:rgba(234,179,8,.16); --radius:9px; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{ background:var(--bg); }
  body{ font-family:'Google Sans','Product Sans',ui-sans-serif,system-ui,-apple-system,sans-serif; color:var(--fg); font-size:13.5px; display:flex; height:100vh; overflow:hidden; -webkit-font-smoothing:antialiased; }
  .i{ display:inline-flex; align-items:center; justify-content:center; } .i svg{ width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .i.sm svg{ width:14px; height:14px; }

  /* sidebar */
  .side{ width:286px; background:var(--sidebar); border-right:1px solid var(--border); display:flex; flex-direction:column; flex:none; }
  .brand{ display:flex; align-items:center; gap:9px; padding:14px 14px 10px; font-weight:700; letter-spacing:-.02em; font-size:15px; }
  .brand .mark{ color:var(--primary); } .brand .mark svg{ width:18px; height:18px; }
  .brand .of{ margin-left:auto; color:var(--muted); width:30px; height:30px; border-radius:7px; cursor:pointer; } .brand .of:hover{ background:var(--accent); color:var(--fg); }
  .rootrow{ padding:0 12px 10px; display:none; gap:6px; } .rootrow.on{ display:flex; }
  .rootrow input{ flex:1; height:32px; border:1px solid var(--border); border-radius:var(--radius); padding:0 10px; font:12px var(--mono); outline:none; background:var(--bg); }
  .rootrow input:focus{ border-color:var(--ring); box-shadow:0 0 0 3px rgba(161,161,170,.18); }
  .rootrow button{ height:32px; border:1px solid var(--border); background:var(--bg); border-radius:var(--radius); padding:0 12px; font-weight:600; font-size:12px; font-family:inherit; cursor:pointer; } .rootrow button:hover{ background:var(--accent); }

  .searchwrap{ padding:0 12px 8px; position:relative; }
  .searchwrap .i{ position:absolute; left:22px; top:50%; transform:translateY(-50%); color:var(--faint); margin-top:-4px; pointer-events:none; }
  .searchwrap input{ width:100%; height:36px; border:1px solid var(--border); border-radius:var(--radius); padding:0 10px 0 34px; font-size:13px; font-family:inherit; outline:none; background:var(--bg); color:var(--fg); }
  .searchwrap input::placeholder{ color:var(--faint); }
  .searchwrap input:focus{ border-color:var(--ring); box-shadow:0 0 0 3px rgba(161,161,170,.18); }

  .seclabel{ font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); padding:10px 16px 4px; display:flex; align-items:center; gap:6px; }
  .projects{ max-height:32vh; overflow:auto; border-bottom:1px solid var(--border); padding:0 6px 6px; }
  .files{ flex:1; overflow:auto; padding:4px 6px 16px; }

  .row{ display:flex; align-items:center; gap:7px; padding:5px 10px; cursor:pointer; white-space:nowrap; width:100%; text-align:left; border:none; background:none; font:inherit; color:var(--fg); border-radius:8px; }
  .row:hover{ background:var(--accent); }
  .row.active{ background:var(--sel); font-weight:600; }
  .row .tw{ width:14px; color:var(--faint); flex:none; } .row .tw svg{ width:14px; height:14px; }
  .row .ic{ color:var(--muted); flex:none; } .row .ic svg{ width:15px; height:15px; }
  .row .nm{ overflow:hidden; text-overflow:ellipsis; }
  .proj .ic{ color:var(--blue); }
  .proj.active{ background:rgba(96,165,250,.14); } .proj.active .nm{ color:var(--blue); } .proj.active .ic{ color:var(--blue); }
  .children{ display:none; } .children.open{ display:block; }

  /* search results */
  .resgrp{ font:600 11px var(--mono); color:var(--muted); padding:8px 12px 2px; overflow:hidden; text-overflow:ellipsis; }
  .resrow{ display:block; width:100%; text-align:left; border:none; background:none; cursor:pointer; padding:3px 12px 3px 18px; font:12px var(--mono); color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .resrow:hover{ background:var(--accent); } .resrow b{ color:var(--faint); margin-right:8px; } .resrow em{ font-style:normal; color:var(--fg); }
  .info{ padding:12px 16px; color:var(--faint); font-size:12px; }

  /* main */
  .main{ flex:1; display:flex; flex-direction:column; min-width:0; background:var(--bg); }
  .top{ height:44px; border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 14px; gap:8px; }
  .top .fp{ font:12px var(--mono); color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .top .cp{ margin-left:auto; color:var(--muted); width:30px; height:30px; border-radius:7px; cursor:pointer; display:none; } .top .cp:hover{ background:var(--accent); color:var(--fg); }
  .codewrap{ flex:1; overflow:auto; position:relative; }
  .content{ position:relative; min-width:100%; min-height:100%; }
  .lineHi{ position:absolute; left:0; width:100%; height:20px; background:var(--hi); display:none; }
  .rows{ display:flex; position:relative; }
  .gutter{ position:sticky; left:0; z-index:2; background:var(--bg); border-right:1px solid var(--border); padding:12px 12px 12px 16px; text-align:right; color:var(--faint); font:12.5px/20px var(--mono); user-select:none; white-space:pre; }
  pre.code{ margin:0; padding:12px 18px; flex:1; } pre.code code{ font:12.5px/20px var(--mono); background:none !important; padding:0; display:block; white-space:pre; }
  .placeholder{ color:var(--faint); padding:48px; font-size:13.5px; }
  .toast{ position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:#2a2d32; color:#f5f6f8; border:1px solid var(--border); font-weight:600; font-size:12px; font-family:inherit; padding:9px 14px; border-radius:var(--radius); opacity:0; transition:opacity .15s; pointer-events:none; } .toast.on{opacity:1;}

  /* collapsible sidebar */
  body.sbcollapsed .side{ display:none; }
  .st{ color:var(--muted); width:30px; height:30px; border-radius:7px; cursor:pointer; flex:none; } .st:hover{ background:var(--accent); color:var(--fg); }
  .st.on{ background:var(--sel); color:var(--fg); }
  /* wrap long lines: wrap the code, drop the gutter + line-highlight (they assume fixed-height rows) */
  body.wrap pre.code{ min-width:0; }   /* flex item must be allowed to shrink so the code can wrap */
  body.wrap pre.code code{ white-space:pre-wrap; overflow-wrap:anywhere; }
  body.wrap .gutter{ display:none; }
  body.wrap .lineHi{ display:none !important; }

  /* projects: collapsible header + add/remove */
  .seclabel.hdr{ cursor:pointer; } .seclabel.hdr:hover{ color:var(--muted); }
  .seclabel .t{ flex:1; }
  .seclabel .tw{ width:14px; flex:none; } .seclabel .tw svg{ width:13px; height:13px; }
  .add{ width:20px; height:20px; border-radius:5px; color:var(--faint); cursor:pointer; } .add:hover{ background:var(--accent); color:var(--fg); } .add svg{ width:14px; height:14px; }
  .projects.collapsed{ display:none; border-bottom:none; }
  .proj .nm{ flex:1; }
  .proj .rm{ width:18px; height:18px; border-radius:4px; color:var(--faint); opacity:0; flex:none; } .proj:hover .rm{ opacity:1; } .proj .rm:hover{ color:#f87171; background:rgba(220,38,38,.14); } .proj .rm svg{ width:12px; height:12px; }
  .untitled .top .fp::before{ content:"●"; color:#f59e0b; margin-right:6px; font-size:9px; vertical-align:middle; }

  /* universal viewers: image / pdf / table / doc */
  .viewer{ padding:24px; min-height:100%; }
  .viewer img{ max-width:100%; height:auto; border:1px solid var(--border); border-radius:8px; background:var(--card); box-shadow:0 1px 3px rgba(0,0,0,.3); }
  .viewer .imeta{ margin-top:10px; font:12px var(--mono); color:var(--faint); }
  iframe.pdf{ width:100%; height:100%; border:0; display:block; }
  .doc{ padding:30px 44px; max-width:860px; margin:0 auto; line-height:1.65; font-size:14.5px; color:var(--fg); }
  .doc h1,.doc h2,.doc h3{ line-height:1.25; margin:1.2em 0 .5em; } .doc p{ margin:0 0 .85em; } .doc img{ max-width:100%; }
  .doc table{ border-collapse:collapse; margin:1em 0; } .doc td,.doc th{ border:1px solid var(--border); padding:6px 10px; }
  .tablewrap{ overflow:auto; max-height:100%; }
  table.dt{ border-collapse:collapse; font-size:13px; margin:14px; background:var(--card); }
  table.dt th, table.dt td{ border:1px solid var(--border); padding:6px 11px; text-align:left; white-space:nowrap; vertical-align:top; }
  table.dt th{ background:var(--sidebar); font-weight:700; position:sticky; top:0; z-index:1; }
  table.dt tr:nth-child(even) td{ background:rgba(255,255,255,.03); }
  table.dt td.num{ text-align:right; font-variant-numeric:tabular-nums; }
  .sheets{ display:flex; gap:5px; padding:12px 16px 2px; flex-wrap:wrap; border-bottom:1px solid var(--border); }
  .sheettab{ padding:5px 12px; border:1px solid var(--border); border-radius:7px; cursor:pointer; font-size:12px; font-weight:600; color:var(--muted); background:var(--bg); }
  .sheettab:hover{ background:var(--accent); } .sheettab.on{ background:var(--primary); color:#fff; border-color:var(--primary); }
  .vhint{ color:var(--faint); padding:40px; font-size:13px; }
  /* markdown */
  .md-doc code{ font:12.5px var(--mono); background:var(--accent); padding:1px 5px; border-radius:4px; }
  .md-doc pre{ background:#0b0c0e; border:1px solid var(--border); border-radius:8px; padding:12px 14px; overflow:auto; } .md-doc pre code{ background:none; padding:0; }
  .md-doc table{ border-collapse:collapse; margin:1em 0; font-size:13.5px; } .md-doc th,.md-doc td{ border:1px solid var(--border); padding:6px 11px; text-align:left; } .md-doc th{ background:var(--sidebar); }
  .md-doc blockquote{ border-left:3px solid var(--border); margin:1em 0; padding:2px 14px; color:var(--muted); }
  .md-doc a{ color:var(--blue); } .md-doc h1{ border-bottom:1px solid var(--border); padding-bottom:.3em; }
  .mdt{ display:none; align-items:center; height:26px; padding:0 11px; border:1px solid var(--border); border-radius:7px; font-size:11.5px; font-weight:600; color:var(--muted); cursor:pointer; flex:none; } .mdt:hover{ background:var(--accent); color:var(--fg); }
  body.mdview .mdt{ display:inline-flex; }
  .top .fp{ flex:1; }
  /* command-palette search popup (⌘F / ⌘K) */
  .cmdk{ position:fixed; inset:0; z-index:1000; display:none; background:rgba(0,0,0,.26); }
  .cmdk.on{ display:block; }
  .cmdk .box{ position:absolute; left:50%; top:78px; transform:translateX(-50%); width:min(680px,92vw); background:var(--bg); border:1px solid var(--border); border-radius:12px; box-shadow:0 24px 70px rgba(0,0,0,.30); display:flex; flex-direction:column; max-height:min(70vh,560px); overflow:hidden; }
  .cmdk .cin{ display:flex; align-items:center; gap:10px; padding:13px 14px; border-bottom:1px solid var(--border); }
  .cmdk .cin .i{ color:var(--faint); flex:none; } .cmdk .cin .i svg{ width:17px; height:17px; }
  .cmdk .cin input{ flex:1; border:none; outline:none; font-size:15px; font-family:inherit; background:none; color:var(--fg); }
  .cmdk .cin input::placeholder{ color:var(--faint); }
  .cmdk .cin kbd{ font:10.5px var(--mono); color:var(--faint); border:1px solid var(--border); border-radius:5px; padding:2px 6px; flex:none; }
  .cmdk .cbar{ height:2px; overflow:hidden; background:transparent; flex:none; }
  .cmdk.loading .cbar{ background:var(--border); }
  .cmdk.loading .cbar span{ display:block; height:100%; width:32%; background:var(--primary); border-radius:2px; animation:cvbar 1.1s ease-in-out infinite; }
  @keyframes cvbar{ 0%{ margin-left:-32%; } 100%{ margin-left:100%; } }
  .cmdk .cres{ overflow:auto; padding:4px 0 6px; }
  .cmdk .cres .resgrp{ font:600 11.5px var(--mono); padding:12px 16px 5px; border:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cmdk .cres .resgrp:first-child{ padding-top:7px; }
  .cmdk .cres .resgrp .d{ color:var(--faint); font-weight:500; } .cmdk .cres .resgrp .f{ color:var(--fg); font-weight:700; }
  .cmdk .cres .resrow{ display:flex; gap:13px; align-items:baseline; padding:5px 16px; font:12.5px/1.45 var(--mono); border-radius:0; }
  .cmdk .cres .resrow b{ color:var(--faint); min-width:38px; text-align:right; flex:none; font-weight:500; margin:0; }
  .cmdk .cres .resrow em{ color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; margin:0; }
  .cmdk .cres .resrow:hover, .cmdk .cres .resrow.sel{ background:var(--accent); } .cmdk .cres .resrow:hover em, .cmdk .cres .resrow.sel em{ color:var(--fg); }
  .cmdk .cres mark{ background:rgba(234,179,8,.30); color:var(--fg); font-weight:700; border-radius:2px; padding:0 1px; }
  .cmdk .cres .info{ padding:20px 16px; }
  .sidefoot{ border-top:1px solid var(--border); padding:9px 14px; font-size:11.5px; color:var(--faint); display:flex; align-items:center; gap:8px; flex:none; }
  .sidefoot:empty{ display:none; }
  .sidefoot .clr{ margin-left:auto; cursor:pointer; color:var(--muted); border:1px solid var(--border); border-radius:6px; padding:2px 10px; font-weight:600; }
  .sidefoot .clr:hover{ color:#f87171; border-color:#7f1d1d; background:rgba(220,38,38,.12); }
</style>
</head>
<body>
  <aside class="side">
    <div class="brand"><span class="mark i" id="iMark"></span> CodeView <span class="of i" id="toggleRoot" title="Open another folder"></span></div>
    <div class="rootrow" id="rootrow"><input id="root" placeholder="/path/to/folder" spellcheck="false"><button id="openRoot">Open</button></div>
    <div class="searchwrap"><span class="i" id="iSearch"></span><input id="search" placeholder="Search all code…  ⌘F" spellcheck="false"></div>
    <div class="seclabel hdr" id="projHdr"><span class="tw i" id="projChev"></span><span class="t">Projects</span><span class="add i" id="addProj" title="Add a project folder"></span></div>
    <div class="projects" id="projects"></div>
    <div class="seclabel" id="filesLabel">Files</div>
    <div class="files" id="list"></div>
    <div class="sidefoot" id="sidefoot"></div>
  </aside>
  <main class="main">
    <div class="top"><span class="st i" id="sideToggle" title="Toggle sidebar (⌘B)"></span><span class="fp" id="fp">Nothing open</span><span class="mdt" id="mdToggle" title="Toggle rendered / source">Source</span><span class="st i" id="wrapBtn" title="Wrap long lines (⌥Z)"></span><span class="st i" id="pasteBtn" title="Paste anything (⌘V) — text, table, image"></span><span class="cp i" id="copyPath" title="Copy path"></span></div>
    <div class="codewrap" id="codewrap"><div class="content" id="content"><div class="placeholder">Open a file, paste anything (⌘V) — code, a table, Excel, Word, an image — or let Claude Code show it here.</div></div></div>
  </main>
  <div class="cmdk" id="cmdk">
    <div class="box">
      <div class="cin"><span class="i" id="cmdkIcon"></span><input id="cmdkIn" placeholder="Search all code…" spellcheck="false" autocomplete="off"><kbd>Esc</kbd></div>
      <div class="cbar"><span></span></div>
      <div class="cres" id="cmdkRes"></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});};
  // highlight all case-insensitive occurrences of q within text (escaped)
  function hl(text,q){ if(!q) return esc(text); var rx; try{ rx=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"ig"); }catch(e){ return esc(text); } var out="",last=0,m; while((m=rx.exec(text))){ out+=esc(text.slice(last,m.index))+"<mark>"+esc(m[0])+"</mark>"; last=m.index+m[0].length; if(m.index===rx.lastIndex) rx.lastIndex++; } return out+esc(text.slice(last)); }
  var LH=20, ROOT="", curFile="", lastCode="";
  var EXT={js:"javascript",jsx:"javascript",mjs:"javascript",cjs:"javascript",ts:"typescript",tsx:"typescript",py:"python",rb:"ruby",go:"go",rs:"rust",java:"java",php:"php",c:"c",h:"c",cpp:"cpp",cs:"csharp",html:"xml",xml:"xml",css:"css",scss:"scss",json:"json",yaml:"yaml",yml:"yaml",md:"markdown",sh:"bash",bash:"bash",sql:"sql",swift:"swift",kt:"kotlin"};
  // Lucide icons (inline)
  var S='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">', E='</svg>';
  var ICONS={
    code:S+'<path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/>'+E,
    chevR:S+'<path d="m9 18 6-6-6-6"/>'+E,
    chevD:S+'<path d="m6 9 6 6 6-6"/>'+E,
    folder:S+'<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>'+E,
    file:S+'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/>'+E,
    search:S+'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>'+E,
    folderPlus:S+'<path d="M12 10v6"/><path d="M9 13h6"/><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>'+E,
    copy:S+'<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>'+E,
    plus:S+'<path d="M5 12h14"/><path d="M12 5v14"/>'+E,
    x:S+'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>'+E,
    panel:S+'<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/>'+E,
    clipboard:S+'<rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>'+E,
    wrap:S+'<path d="M3 6h18"/><path d="M3 12h15a3 3 0 1 1 0 6h-4"/><path d="m16 16-2 2 2 2"/><path d="M3 18h7"/>'+E
  };
  $("iMark").innerHTML=ICONS.code; $("iSearch").innerHTML=ICONS.search; $("toggleRoot").innerHTML=ICONS.folderPlus; $("copyPath").innerHTML=ICONS.copy;
  $("addProj").innerHTML=ICONS.plus; $("sideToggle").innerHTML=ICONS.panel; $("projChev").innerHTML=ICONS.chevD; $("pasteBtn").innerHTML=ICONS.clipboard; $("cmdkIcon").innerHTML=ICONS.search; $("wrapBtn").innerHTML=ICONS.wrap;

  function toast(m){ var t=$("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(t._x); t._x=setTimeout(function(){t.classList.remove("on");},1500); }

  // ---------- projects (user-curated list) ----------
  function renderProjects(list){
    var P=$("projects");
    P.innerHTML=(list||[]).map(function(p){
      return '<button class="row proj" data-root="'+esc(p.path)+'"><span class="ic i sm">'+ICONS.folder+'</span><span class="nm" title="'+esc(p.path)+'">'+esc(p.name)+'</span><span class="rm i" data-rm="'+esc(p.path)+'" title="Remove">'+ICONS.x+'</span></button>';
    }).join("")||'<div class="info">No projects yet — click ＋ to add a folder.</div>';
    Array.prototype.forEach.call(P.querySelectorAll(".proj"),function(b){
      b.onclick=function(ev){ if(ev.target.closest(".rm")) return; setRoot(b.dataset.root); };
    });
    Array.prototype.forEach.call(P.querySelectorAll(".rm"),function(x){
      x.onclick=function(ev){ ev.stopPropagation(); removeProject(x.dataset.rm); };
    });
    markActiveProject();
  }
  function loadProjects(){ fetch("/api/projects").then(function(r){return r.json();}).then(function(d){ renderProjects(d.projects); }); }

  // ---------- backups (every opened file is snapshotted; clearable) ----------
  function loadBackups(){
    fetch("/api/backups").then(function(r){return r.json();}).then(function(d){
      var f=$("sidefoot"), n=d.count||0;
      f.innerHTML='<span title="A deduped snapshot of every file opened here">⎘ '+n+' backup'+(n===1?'':'s')+'</span>'+(n?'<span class="clr" id="bkClear">Clear</span>':'');
      var c=$("bkClear"); if(c) c.onclick=function(){ if(confirm("Delete all "+n+" backups?")) fetch("/api/backups/clear",{method:"POST"}).then(function(){ toast("Backups cleared"); loadBackups(); }); };
    }).catch(function(){});
  }
  function removeProject(path){
    fetch("/api/projects/remove",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({path:path})}).then(function(r){return r.json();}).then(function(d){ renderProjects(d.projects||[]); });
  }
  function addAndOpen(rp){
    if(!rp) return;
    fetch("/api/projects/add",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({path:rp})}).then(function(r){return r.json();}).then(function(d){
      if(d.error){ toast(d.error); return; }
      renderProjects(d.projects||[]); $("rootrow").classList.remove("on"); setRoot(rp);
    });
  }
  function markActiveProject(){ Array.prototype.forEach.call(document.querySelectorAll(".proj"),function(b){ b.classList.toggle("active", b.dataset.root===ROOT); }); }
  // expand / collapse the projects list
  function setProjCollapsed(on){ $("projects").classList.toggle("collapsed",on); $("projChev").innerHTML=on?ICONS.chevR:ICONS.chevD; try{localStorage.setItem("cv.proj",on?"1":"0");}catch(e){} }
  $("projHdr").onclick=function(ev){ if(ev.target.closest("#addProj")) return; setProjCollapsed(!$("projects").classList.contains("collapsed")); };
  $("addProj").onclick=function(ev){ ev.stopPropagation(); setProjCollapsed(false); var r=$("rootrow"); r.classList.add("on"); $("root").value=""; $("root").focus(); };

  // ---------- tree ----------
  function treeRow(e, depth){
    var pad=12+depth*13;
    if(e.dir){
      var wrap=document.createElement("div");
      var btn=document.createElement("button"); btn.className="row"; btn.style.paddingLeft=pad+"px";
      btn.innerHTML='<span class="tw i">'+ICONS.chevR+'</span><span class="ic i">'+ICONS.folder+'</span><span class="nm">'+esc(e.name)+'</span>';
      var kids=document.createElement("div"); kids.className="children"; var loaded=false;
      btn.onclick=function(){ var open=kids.classList.toggle("open"); btn.querySelector(".tw").innerHTML=open?ICONS.chevD:ICONS.chevR;
        if(open&&!loaded){ loaded=true; fetch("/api/tree?dir="+encodeURIComponent(e.path)).then(function(r){return r.json();}).then(function(d){ (d.entries||[]).forEach(function(c){ kids.appendChild(treeRow(c,depth+1)); }); }); } };
      wrap.appendChild(btn); wrap.appendChild(kids); return wrap;
    }
    var f=document.createElement("button"); f.className="row"; f.style.paddingLeft=pad+"px"; f.dataset.path=e.path;
    f.innerHTML='<span class="tw"></span><span class="ic i">'+ICONS.file+'</span><span class="nm">'+esc(e.name)+'</span>';
    f.onclick=function(){ openFile(e.path); };
    return f;
  }
  function loadTree(){
    fetch("/api/tree?dir="+encodeURIComponent(ROOT)).then(function(r){return r.json();}).then(function(d){
      var L=$("list"); L.innerHTML=""; (d.entries||[]).forEach(function(e){ L.appendChild(treeRow(e,0)); });
    });
  }

  // ---------- search ----------
  var sdeb;
  function runSearch(q){
    if(!q||q.trim().length<2){ $("filesLabel").textContent="Files"; loadTree(); return; }
    $("filesLabel").textContent="Results"; $("list").innerHTML='<div class="info">Searching…</div>';
    fetch("/api/search?q="+encodeURIComponent(q)).then(function(r){return r.json();}).then(function(d){
      var res=d.results||[], L=$("list");
      if(!res.length){ L.innerHTML='<div class="info">No matches.</div>'; return; }
      var byFile={}, order=[]; res.forEach(function(m){ if(!byFile[m.path]){byFile[m.path]=[];order.push(m.path);} byFile[m.path].push(m); });
      L.innerHTML=order.map(function(fp){ return '<div class="resgrp" title="'+esc(fp)+'">'+esc(byFile[fp][0].rel)+'</div>'+byFile[fp].map(function(m){ return '<button class="resrow" data-path="'+esc(fp)+'" data-line="'+m.line+'"><b>'+m.line+'</b><em>'+esc(m.text.trim())+'</em></button>'; }).join(""); }).join("");
      Array.prototype.forEach.call(L.querySelectorAll(".resrow"),function(b){ b.onclick=function(){ openFile(b.dataset.path,+b.dataset.line); }; });
    });
  }
  $("search").addEventListener("input",function(){ clearTimeout(sdeb); var q=this.value; sdeb=setTimeout(function(){runSearch(q);},250); });
  // ⌘K / ⌘F (and Ctrl+) → open the floating search popup. Overrides the browser's native find.
  document.addEventListener("keydown",function(e){ var k=e.key.toLowerCase(); if((e.metaKey||e.ctrlKey)&&(k==="k"||k==="f")){ e.preventDefault(); openCmd(); } });

  // ---------- command-palette search popup ----------
  function openCmd(){ $("cmdk").classList.add("on"); cmdReq++; setCmdLoading(false); var i=$("cmdkIn"); i.value=""; $("cmdkRes").innerHTML='<div class="info">Type at least 2 characters to search all code…</div>'; cmdSel=-1; setTimeout(function(){ try{i.focus();}catch(e){} },0); }
  function closeCmd(){ $("cmdk").classList.remove("on"); }
  var cdeb, cmdSel=-1, cmdReq=0;
  function cmdRows(){ return $("cmdkRes").querySelectorAll(".resrow"); }
  function cmdSelect(n){ var rows=cmdRows(); if(!rows.length) return; cmdSel=(n+rows.length)%rows.length; Array.prototype.forEach.call(rows,function(r,i){ r.classList.toggle("sel",i===cmdSel); }); rows[cmdSel].scrollIntoView({block:"nearest"}); }
  function cmdOpenRow(r){ if(!r) return; openFile(r.dataset.path,+r.dataset.line); closeCmd(); }
  function setCmdLoading(on){ $("cmdk").classList.toggle("loading",on); }
  function cmdHasResults(){ var R=$("cmdkRes"); return !!(R.querySelector(".resrow")||R.querySelector(".resgrp")); }
  function cmdSearch(q){
    var R=$("cmdkRes");
    if(!q||q.trim().length<2){ cmdReq++; setCmdLoading(false); R.innerHTML='<div class="info">Type at least 2 characters to search all code…</div>'; cmdSel=-1; return; }
    var seq=++cmdReq;
    setCmdLoading(true);                                   // thin progress bar; keep existing results on screen
    if(!cmdHasResults()) R.innerHTML='<div class="info">Searching…</div>';   // only when there's nothing to keep
    fetch("/api/search?q="+encodeURIComponent(q)).then(function(r){return r.json();}).then(function(d){
      if(seq!==cmdReq) return;                             // a newer keystroke superseded this — ignore (no flicker)
      setCmdLoading(false);
      var res=d.results||[]; if(!res.length){ R.innerHTML='<div class="info">No matches.</div>'; cmdSel=-1; return; }
      var byFile={},order=[]; res.forEach(function(m){ if(!byFile[m.path]){byFile[m.path]=[];order.push(m.path);} byFile[m.path].push(m); });
      R.innerHTML=order.map(function(fp){
        var rel=byFile[fp][0].rel, sl=rel.lastIndexOf("/"), dir=sl>=0?rel.slice(0,sl+1):"", base=sl>=0?rel.slice(sl+1):rel;
        return '<div class="resgrp" title="'+esc(fp)+'"><span class="d">'+esc(dir)+'</span><span class="f">'+esc(base)+'</span></div>'+
          byFile[fp].map(function(m){ return '<button class="resrow" data-path="'+esc(fp)+'" data-line="'+m.line+'"><b>'+m.line+'</b><em>'+hl(m.text.trim(),q)+'</em></button>'; }).join("");
      }).join("");
      Array.prototype.forEach.call(cmdRows(),function(b){ b.onclick=function(){ cmdOpenRow(b); }; });
      cmdSel=-1; R.scrollTop=0;
    }).catch(function(){ if(seq===cmdReq) setCmdLoading(false); });
  }
  $("cmdkIn").addEventListener("input",function(){ clearTimeout(cdeb); var q=this.value; cdeb=setTimeout(function(){ cmdSearch(q); },300); });
  $("cmdkIn").addEventListener("keydown",function(e){
    if(e.key==="Escape"){ e.preventDefault(); closeCmd(); }
    else if(e.key==="ArrowDown"){ e.preventDefault(); cmdSelect(cmdSel+1); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); cmdSelect(cmdSel-1); }
    else if(e.key==="Enter"){ e.preventDefault(); var rows=cmdRows(); cmdOpenRow(cmdSel>=0?rows[cmdSel]:rows[0]); }
  });
  $("cmdk").addEventListener("mousedown",function(e){ if(e.target===$("cmdk")) closeCmd(); });

  // ---------- file view ----------
  function cssq(s){ return String(s).replace(/(["\\])/g,"\\$1"); }
  var IMG_EXT={png:1,jpg:1,jpeg:1,gif:1,webp:1,svg:1,bmp:1,ico:1,avif:1};
  function kindFor(ext){ ext=(ext||"").toLowerCase();
    if(IMG_EXT[ext]) return "image";
    if(ext==="pdf") return "pdf";
    if(ext==="xlsx"||ext==="xls") return "sheet";
    if(ext==="docx") return "doc";
    if(ext==="csv"||ext==="tsv") return "table";
    if(ext==="md"||ext==="markdown") return "md";
    return "code";
  }
  function setHeader(title,path){ $("fp").textContent=title; $("fp").title=path||title; $("copyPath").style.display=path?"":"none"; }
  function markActiveFile(fp){ Array.prototype.forEach.call(document.querySelectorAll(".row.active"),function(el){ if(el.dataset.path) el.classList.remove("active"); }); if(fp){ var el=document.querySelector('.row[data-path="'+cssq(fp)+'"]'); if(el) el.classList.add("active"); } }
  var C=function(){ return $("content"); };

  function openFile(fp, line){
    curFile=fp; document.body.classList.remove("untitled");
    var ext=(fp.split(".").pop()||"").toLowerCase(), kind=kindFor(ext);
    setHeader(fp, fp); markActiveFile(fp); setTimeout(loadBackups,500);
    if(kind!=="md") setMdView(false);
    if(kind==="code"||kind==="md"){
      fetch("/api/file?path="+encodeURIComponent(fp)).then(function(r){return r.json();}).then(function(d){
        if(d.error){ toast(d.error); return; }
        if(/^\(binary file\)/.test(d.content||"")){ renderDownload(fp); return; }
        if(kind==="md") showMd(d.content||""); else renderCode(d.content||"", d.ext||"", line||0);
      });
      return;
    }
    var url="/api/raw?path="+encodeURIComponent(fp);
    if(kind==="image") renderImage(url);
    else if(kind==="pdf") renderPdf(url);
    else if(kind==="sheet") renderSheet(url);
    else if(kind==="doc") renderDoc(url);
    else if(kind==="table") renderCsvUrl(url);
  }

  // ---------- universal renderers: image / pdf / excel / word / table ----------
  function renderImage(url){ C().innerHTML='<div class="viewer"><img src="'+esc(url)+'" alt=""><div class="imeta" id="imeta"></div></div>'; var img=C().querySelector("img"); if(img) img.onload=function(){ var m=$("imeta"); if(m) m.textContent=img.naturalWidth+" × "+img.naturalHeight+" px"; }; }
  function renderPdf(url){ C().innerHTML='<iframe class="pdf" src="'+esc(url)+'"></iframe>'; }
  function renderDownload(fp){ C().innerHTML='<div class="vhint">Binary file — <a href="/api/raw?path='+encodeURIComponent(fp)+'" download>download</a> to open.</div>'; }
  function renderCsvUrl(url){ fetch(url).then(function(r){return r.text();}).then(function(t){ renderTable(parseDelim(t, sniffDelim(t))); }).catch(function(){ C().innerHTML='<div class="vhint">Couldn’t load.</div>'; }); }
  function renderDoc(url){
    if(!window.mammoth){ C().innerHTML='<div class="vhint">Loading Word viewer…</div>'; return setTimeout(function(){ renderDoc(url); },400); }
    C().innerHTML='<div class="vhint">Rendering document…</div>';
    fetch(url).then(function(r){return r.arrayBuffer();}).then(function(ab){ return mammoth.convertToHtml({arrayBuffer:ab}); })
      .then(function(res){ C().innerHTML='<div class="doc">'+((res&&res.value)||"<p>(empty document)</p>")+'</div>'; })
      .catch(function(){ C().innerHTML='<div class="vhint">Couldn’t read this .docx.</div>'; });
  }
  function renderSheet(url){
    if(!window.XLSX){ C().innerHTML='<div class="vhint">Loading spreadsheet viewer…</div>'; return setTimeout(function(){ renderSheet(url); },400); }
    C().innerHTML='<div class="vhint">Reading spreadsheet…</div>';
    fetch(url).then(function(r){return r.arrayBuffer();}).then(function(ab){
      var wb=XLSX.read(ab,{type:"array"}); var names=wb.SheetNames||[];
      if(!names.length){ C().innerHTML='<div class="vhint">Empty workbook.</div>'; return; }
      renderSheetTabs(wb, names, 0);
    }).catch(function(){ C().innerHTML='<div class="vhint">Couldn’t read this spreadsheet.</div>'; });
  }
  function renderSheetTabs(wb, names, idx){
    var tabs=names.map(function(n,i){ return '<button class="sheettab'+(i===idx?" on":"")+'" data-si="'+i+'">'+esc(n)+'</button>'; }).join("");
    var rows=XLSX.utils.sheet_to_json(wb.Sheets[names[idx]],{header:1,blankrows:false,defval:""});
    C().innerHTML=(names.length>1?'<div class="sheets">'+tabs+'</div>':'')+'<div class="tablewrap" id="tw"></div>';
    tableInto($("tw"), rows);
    if(names.length>1) Array.prototype.forEach.call(C().querySelectorAll(".sheettab"),function(b){ b.onclick=function(){ renderSheetTabs(wb,names,+b.dataset.si); }; });
  }
  function renderTable(rows){ C().innerHTML='<div class="tablewrap" id="tw"></div>'; tableInto($("tw"), rows); }
  function tableInto(host, rows){
    if(!rows||!rows.length){ host.innerHTML='<div class="vhint">No rows.</div>'; return; }
    var isNum=function(v){ return v!==""&&v!=null&&!isNaN(v); };
    var head=rows[0], body=rows.slice(1);
    var html='<table class="dt"><thead><tr>'+head.map(function(c){ return '<th>'+esc(c)+'</th>'; }).join("")+'</tr></thead><tbody>';
    html+=body.map(function(r){ return '<tr>'+head.map(function(_,i){ var v=(r[i]==null?"":r[i]); return '<td'+(isNum(v)?' class="num"':'')+'>'+esc(v)+'</td>'; }).join("")+'</tr>'; }).join("");
    C(); host.innerHTML=html+'</tbody></table>';
  }
  function sniffDelim(t){ var f=(t.split("\n")[0]||""); return (f.split("\t").length > f.split(",").length) ? "\t" : ","; }
  function parseDelim(text, d){
    var rows=[], row=[], cur="", q=false, i, c;
    for(i=0;i<text.length;i++){ c=text[i];
      if(q){ if(c==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=c; }
      else if(c==='"') q=true;
      else if(c===d){ row.push(cur); cur=""; }
      else if(c==="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; }
      else if(c==="\r"){}
      else cur+=c;
    }
    if(cur.length||row.length){ row.push(cur); rows.push(row); }
    return rows;
  }

  // ---------- markdown (rendered by default, toggle to source) ----------
  var mdText="", mdRendered=true;
  function setMdView(on){ document.body.classList.toggle("mdview", on); }
  function showMd(text){ mdText=text; lastCode=text; mdRendered=true; setMdView(true); $("mdToggle").textContent="Source"; paintMd(); }
  function paintMd(){
    if(mdRendered){
      if(!window.marked){ C().innerHTML='<div class="vhint">Loading markdown…</div>'; return setTimeout(paintMd,300); }
      var html; try{ html=marked.parse(mdText,{gfm:true}); }catch(e){ html="<pre>"+esc(mdText)+"</pre>"; }
      C().innerHTML='<div class="doc md-doc">'+html+'</div>';
    } else renderCode(mdText, "md", 0);
  }
  $("mdToggle").onclick=function(){ mdRendered=!mdRendered; $("mdToggle").textContent=mdRendered?"Source":"Rendered"; paintMd(); };
  function renderCode(content, ext, line){
    lastCode=content;
    var lines=content.split("\n"), g=[]; for(var i=1;i<=lines.length;i++) g.push(i);
    var lang=EXT[ext]||"", codeHtml;
    try{ codeHtml = lang&&window.hljs&&hljs.getLanguage(lang) ? hljs.highlight(content,{language:lang}).value : (window.hljs?hljs.highlightAuto(content).value:esc(content)); }catch(e){ codeHtml=esc(content); }
    $("content").innerHTML='<div class="lineHi" id="lineHi"></div><div class="rows"><div class="gutter">'+g.join("\n")+'</div><pre class="code"><code class="hljs">'+codeHtml+'</code></pre></div>';
    var wrap=$("codewrap");
    if(line>0){ var hi=$("lineHi"); hi.style.top=((line-1)*LH+12)+"px"; hi.style.display="block"; wrap.scrollTop=Math.max(0,(line-1)*LH+12-wrap.clientHeight/3); }
    else wrap.scrollTop=0;
  }
  $("copyPath").onclick=function(){ if(curFile){ navigator.clipboard.writeText(curFile).then(function(){ toast("Path copied"); }); } else if(lastCode){ navigator.clipboard.writeText(lastCode).then(function(){ toast("Code copied"); }); } };

  // ---------- root ----------
  $("toggleRoot").onclick=function(){ $("rootrow").classList.toggle("on"); if($("rootrow").classList.contains("on")) $("root").focus(); };
  function setRoot(rp){
    fetch("/api/root",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({path:rp})}).then(function(r){return r.json();}).then(function(d){
      if(d.error){ toast(d.error); return; } ROOT=d.root; $("root").value=ROOT; $("search").value=""; $("filesLabel").textContent="Files"; loadTree(); markActiveProject();
    });
  }
  $("openRoot").onclick=function(){ addAndOpen($("root").value.trim()); };   // opening a folder also saves it as a project
  $("root").addEventListener("keydown",function(e){ if(e.key==="Enter") $("openRoot").click(); });

  // ---------- sidebar collapse (collapsed by default — this is mainly a Claude-push viewer) ----------
  function setSide(collapsed){ document.body.classList.toggle("sbcollapsed",collapsed); try{localStorage.setItem("cv.side",collapsed?"1":"0");}catch(e){} }
  $("sideToggle").onclick=function(){ setSide(!document.body.classList.contains("sbcollapsed")); };
  document.addEventListener("keydown",function(e){ if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="b"){ e.preventDefault(); $("sideToggle").click(); } });

  // ---------- wrap long lines ----------
  function setWrap(on){ document.body.classList.toggle("wrap",on); $("wrapBtn").classList.toggle("on",on); try{localStorage.setItem("cv.wrap",on?"1":"0");}catch(e){} }
  $("wrapBtn").onclick=function(){ setWrap(!document.body.classList.contains("wrap")); };
  document.addEventListener("keydown",function(e){ if(e.altKey && e.key.toLowerCase()==="z"){ e.preventDefault(); $("wrapBtn").click(); } });

  // ---------- paste anything (text / table / image / rich HTML) ----------
  function pastedHeader(t){ curFile=""; lastCode=""; setMdView(false); document.body.classList.add("untitled"); setHeader(t||"Pasted", null); markActiveFile(null); }
  function showText(text, title){
    pastedHeader(title); lastCode=text;
    var lines=text.split("\n"), first=lines[0]||"";
    // looks tabular? (tabs, or ≥2 commas across several rows) → render as a table
    if(lines.length>1 && (first.indexOf("\t")>=0 || (first.split(",").length>=2 && lines.length>2))) renderTable(parseDelim(text, sniffDelim(text)));
    else renderCode(text, "", 0);
  }
  function showPastedImageBlob(blob){ pastedHeader("Pasted image"); renderImage(URL.createObjectURL(blob)); }
  function showPastedHtml(html){ pastedHeader("Pasted"); C().innerHTML='<div class="doc">'+String(html).replace(/<script[\s\S]*?<\/script>/gi,"")+'</div>'; }

  document.addEventListener("paste", function(e){
    var t=e.target; if(t && (t.tagName==="INPUT"||t.tagName==="TEXTAREA")) return;   // leave the search/path boxes alone
    var dt=e.clipboardData; if(!dt) return;
    for(var i=0;i<dt.items.length;i++){ var it=dt.items[i]; if(it.type && it.type.indexOf("image")===0){ var b=it.getAsFile(); if(b){ showPastedImageBlob(b); e.preventDefault(); return; } } }
    var html=dt.getData("text/html"), text=dt.getData("text/plain");
    if(html && /<table/i.test(html)){ showPastedHtml(html); e.preventDefault(); return; }
    if(text){ showText(text); e.preventDefault(); return; }
  });
  $("pasteBtn").onclick=function(){
    if(navigator.clipboard && navigator.clipboard.read){
      navigator.clipboard.read().then(function(items){
        for(var i=0;i<items.length;i++){ var it=items[i], imgT=it.types.filter(function(x){return x.indexOf("image")===0;})[0];
          if(imgT){ it.getType(imgT).then(showPastedImageBlob); return; } }
        navigator.clipboard.readText().then(function(txt){ if(txt) showText(txt); else toast("Clipboard empty — press ⌘V"); }).catch(function(){ toast("Press ⌘V to paste"); });
      }).catch(function(){ (navigator.clipboard.readText?navigator.clipboard.readText():Promise.reject()).then(function(txt){ if(txt) showText(txt); else toast("Press ⌘V to paste"); }).catch(function(){ toast("Press ⌘V to paste"); }); });
    } else toast("Press ⌘V to paste");
  };

  // ---------- poll: Claude pushes a file OR raw untitled code ----------
  var lastV=-1;
  function poll(){ fetch("/api/current").then(function(r){return r.json();}).then(function(c){
    if(c.v===lastV) return; lastV=c.v;
    if(c.content!=null){   // untitled / inline snippet — no file on disk
      curFile=""; var t=c.title||"Untitled";
      document.body.classList.add("untitled");
      $("fp").textContent=t; $("fp").title=t; $("copyPath").style.display="";
      var ce=(c.ext||"").toLowerCase();
      if(ce==="md"||ce==="markdown") showMd(c.content); else { setMdView(false); renderCode(c.content,c.ext||"",c.line||0); }
      Array.prototype.forEach.call(document.querySelectorAll(".row.active"),function(el){ if(el.dataset.path) el.classList.remove("active"); });
    } else if(c.path){
      document.body.classList.remove("untitled");
      openFile(c.path,c.line||0);
      fetch("/api/config").then(function(r){return r.json();}).then(function(cf){ if(cf.root!==ROOT){ ROOT=cf.root; $("root").value=ROOT; loadTree(); markActiveProject(); } });
    }
  }).catch(function(){}); }

  // boot
  (function(){ setSide(true);   // always hidden on load — CodeView is mainly a push viewer; ⌘B (or the panel icon) reveals it, ⌘F searches
    var pc; try{pc=localStorage.getItem("cv.proj");}catch(e){} if(pc==="1") setProjCollapsed(true);
    var wp; try{wp=localStorage.getItem("cv.wrap");}catch(e){} setWrap(wp==="1"); })();
  fetch("/api/config").then(function(r){return r.json();}).then(function(c){ ROOT=c.root; $("root").value=ROOT; loadProjects(); loadTree(); loadBackups(); lastV=0; });
  setInterval(poll,1200);
})();
</script>
</body>
